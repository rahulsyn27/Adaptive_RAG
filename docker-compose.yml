services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      CHROMA_PATH: /app/data/chroma
      DATABASE_URL: sqlite:////app/data/adaptive_rag.db
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data

  ui:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      ADAPTIVE_RAG_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  app_data: